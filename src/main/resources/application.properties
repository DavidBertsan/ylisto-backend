spring.application.name=ylisto

# Defaults match docker-compose.yml; override with env vars in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/ylisto}
spring.datasource.username=${DB_USER:ylisto}
spring.datasource.password=${DB_PASSWORD:ylisto}

# HS256 signing key (min 32 bytes). The default is for local dev/CI only: set JWT_SECRET in any real environment.
ylisto.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-it-must-be-32-bytes-long}
ylisto.jwt.ttl=PT8H

# ponytail: schema generated from entities; switch to Flyway migrations before the first real deploy.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
