# `docker compose up` starts the whole backend (Postgres + Flyway + API) with no JDK installed.
# For local development from the IDE, start only the database: `docker compose up -d db`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ylisto
      POSTGRES_USER: ylisto
      POSTGRES_PASSWORD: ylisto
    ports:
      - "5434:5432"
    volumes:
      - ylisto-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ylisto -d ylisto"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections, not just until it started
    environment:
      DB_URL: jdbc:postgresql://db:5432/ylisto
      DB_USER: ylisto
      DB_PASSWORD: ylisto
      # Demo-only secret: set a real one in any shared environment
      JWT_SECRET: local-demo-secret-change-me-it-must-be-32-bytes
    ports:
      - "8080:8080"

volumes:
  ylisto-data:
